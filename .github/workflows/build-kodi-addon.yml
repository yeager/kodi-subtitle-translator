name: Build Kodi Addon

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get addon info
        id: addon
        run: |
          ADDON_ID=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().get('id'))")
          ADDON_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().get('version'))")
          echo "id=${ADDON_ID}" >> "$GITHUB_OUTPUT"
          echo "version=${ADDON_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create addon zip
        run: python3 scripts/build_addon.py --output dist

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          ADDON_ID="${{ steps.addon.outputs.id }}"
          VERSION="${{ steps.addon.outputs.version }}"
          test "$RELEASE_TAG" = "v${VERSION}"
          gh release upload "$RELEASE_TAG" \
            "dist/${ADDON_ID}-${VERSION}.zip" \
            "dist/${ADDON_ID}-${VERSION}.zip.md5"

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.addon.outputs.id }}-${{ steps.addon.outputs.version }}
          path: "dist/*"
