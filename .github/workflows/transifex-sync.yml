name: Sync Transifex Translations

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Transifex CLI
        run: |
          curl --fail --location --silent --show-error https://github.com/transifex/cli/releases/download/v1.6.17/tx-linux-amd64.tar.gz -o /tmp/tx-linux-amd64.tar.gz
          echo "002dec5b9e71248a7e6a0808118e9da940205828d5a33ce88e04bb57a967164d  /tmp/tx-linux-amd64.tar.gz" | sha256sum --check
          tar -xzf /tmp/tx-linux-amd64.tar.gz -C /tmp tx
          sudo install -m 755 /tmp/tx /usr/local/bin/tx

      - name: Push source strings to Transifex
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx push --source --force

      - name: Pull translations (minimum 20%)
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx pull --all --force --minimum-perc=20

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources/language/
          if git diff --cached --quiet; then
            echo "No translation changes"
          else
            git commit -m "i18n: sync translations from Transifex"
            git push
          fi
